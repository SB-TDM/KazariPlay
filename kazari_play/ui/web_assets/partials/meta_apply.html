      <button class="close-btn" id="metaApplyClose" aria-label="关闭">×</button></div>
    <div class="relocate-sub">
      <span id="metaApplySub"></span>
      <span class="relocate-actions">
        <button type="button" class="relocate-mini" id="metaApplySelBtn">全选</button>

      <button class="pill-btn primary" id="metaApplyOk">应用</button>
    </div>
  </div>
