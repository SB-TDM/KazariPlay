<!-- 应用内更新弹层（main.py 注入到 index.html 的 PARTIALS 标记处） -->

<div class="overlay center" id="updateOverlay">
  <div class="dialog update">
    <div class="dlg-title"><span id="updateTitle">发现新版本</span>
      <button class="close-btn" id="updateClose" aria-label="关闭"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg></button></div>
    <div class="up-body">
      <div class="up-line">新版本 <b id="updateNewVer">-</b> · 大小 <span id="updateSize">-</span></div>
      <div class="up-notes" id="updateNotes"></div>
      <div class="up-prog" id="updateProg" hidden>
        <div class="up-bar"><div class="up-fill" id="updateFill"></div></div>
        <div class="up-prog-text" id="updateProgText"></div>
      </div>
      <div class="up-error" id="updateError" hidden></div>
    </div>
    <div class="dlg-foot" id="updateFoot">
      <button class="pill-btn" id="updateSkip">跳过此版本</button>
      <button class="pill-btn" id="updateLater">稍后</button>
      <button class="pill-btn primary" id="updateGo">下载并更新</button>
    </div>
    <div class="dlg-foot" id="updateFootReady" hidden>
      <button class="pill-btn primary" id="updateApplyNow">立即重启更新</button>
    </div>
    <div class="dlg-foot" id="updateFootFail" hidden>
      <button class="pill-btn" id="updateExit">退出</button>
      <button class="pill-btn" id="updateOpenPage">打开发布页</button>
      <button class="pill-btn primary" id="updateRetry">重试</button>
    </div>
  </div>
</div>
