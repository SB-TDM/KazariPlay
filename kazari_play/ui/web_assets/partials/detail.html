<!-- 详情抽屉 + 截图预览/右键菜单（main.py 注入到 index.html 的 PARTIALS 标记处） -->

<!-- 详情底部抽屉 -->
<div class="overlay" id="detailOverlay">
  <div class="dialog detail" id="detailDialog">
    <div class="detail-cover" id="dlgCover"></div>
    <div class="detail-body">
      <div class="detail-head">
        <h2 id="dlgTitle"></h2>
        <div class="more-wrap">
          <button class="close-btn" id="dlgMore" aria-label="更多操作"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/></svg></button>
          <div class="more-menu" id="dlgMoreMenu" role="menu">
            <button type="button" class="item" data-act="vndb">元数据匹配</button>
            <button type="button" class="item" data-act="open">打开本地目录</button>
            <button type="button" class="item danger" data-act="del">删除</button>
          </div>
        </div>
        <button class="close-btn" id="dlgClose" aria-label="关闭详情"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg></button>
      </div>
      <div class="info-grid" id="dlgInfo"></div>
      <div class="detail-actions">
        <button class="pill-btn primary" id="dlgStart">开始游戏</button>
        <button class="pill-btn" id="dlgEdit">编辑</button>
        <button class="pill-btn fav" id="dlgFav"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z"/></svg> 收藏</button>
      </div>
      <div class="detail-desc" id="dlgDesc"></div>
      <div class="collections-row" id="dlgCollections"></div>
      <!-- 游戏截图（Steam 式） -->
      <div class="screenshots-section">
        <div class="shots-head">
          <span class="shots-ttl">截图</span>
          <span class="shots-hint">左键预览 · 右键管理</span>
        </div>
        <div class="shots-grid" id="shotsGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- 截图大图预览 -->
<div class="overlay center" id="shotPreviewOverlay">
  <div class="dialog shot-preview">
    <div class="dlg-title"><span id="shotPreviewTitle">截图</span>
      <button class="close-btn" id="shotPreviewClose" aria-label="关闭预览"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg></button></div>
    <div class="shot-preview-body">
      <div class="shot-preview-loading" id="shotPreviewLoading">加载中…</div>
      <img id="shotPreviewImg" alt="">
    </div>
  </div>
</div>

<!-- 截图右键菜单 -->
<div class="shot-menu" id="shotMenu" role="menu">
  <button type="button" class="item" data-act="rename">重命名</button>
  <button type="button" class="item" data-act="folder">打开所在位置</button>
  <button type="button" class="item" data-act="copy">复制到剪贴板</button>
  <button type="button" class="item danger" data-act="del">删除</button>
</div>
