<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{APP_TITLE}}</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home-view">
<div class="app">
  <!-- 标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="brand"><div class="logo">☺</div><div class="name">{{APP_TITLE}}</div></div>
    <div class="spacer"></div>
    <div class="winbtns">
      <button type="button" class="winbtn" aria-label="最小化" onclick="bridge&&bridge.windowMinimize()"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8"/></svg></button>
      <button type="button" class="winbtn" id="btnMax" aria-label="最大化" onclick="toggleMax()"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/></svg></button>
      <button type="button" class="winbtn close" aria-label="关闭窗口" onclick="bridge&&bridge.windowClose()"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg></button>
    </div>
  </div>

  <div class="row">
    <!-- 侧边栏（图标列）：导航 + 底部功能 -->
    <div class="sidebar" id="sidebar">
      <button type="button" class="side-item active" data-nav="主页" id="btnNavHome" title="主页" aria-label="主页"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/><path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/></svg></button>
      <button type="button" class="side-item" data-nav="全部作品" id="btnNavAll" title="全部作品" aria-label="全部作品"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M11.5 6.027a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m-1.5 1.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m2.5-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m-1.5 1.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m-6.5-3h1v1h1v1h-1v1h-1v-1h-1v-1h1z"/><path d="M3.051 3.26a.5.5 0 0 1 .354-.613l1.932-.518a.5.5 0 0 1 .62.39c.655-.079 1.35-.117 2.043-.117.72 0 1.443.041 2.12.126a.5.5 0 0 1 .622-.399l1.932.518a.5.5 0 0 1 .306.729q.211.136.373.297c.408.408.78 1.05 1.095 1.772.32.733.599 1.591.805 2.466s.34 1.78.364 2.606c.024.816-.059 1.602-.328 2.21a1.42 1.42 0 0 1-1.445.83c-.636-.067-1.115-.394-1.513-.773-.245-.232-.496-.526-.739-.808-.126-.148-.25-.292-.368-.423-.728-.804-1.597-1.527-3.224-1.527s-2.496.723-3.224 1.527c-.119.131-.242.275-.368.423-.243.282-.494.575-.739.808-.398.38-.877.706-1.513.773a1.42 1.42 0 0 1-1.445-.83c-.27-.608-.352-1.395-.329-2.21.024-.826.16-1.73.365-2.606.206-.875.486-1.733.805-2.466.315-.722.687-1.364 1.094-1.772a2.3 2.3 0 0 1 .433-.335l-.028-.079zm2.036.412c-.877.185-1.469.443-1.733.708-.276.276-.587.783-.885 1.465a14 14 0 0 0-.748 2.295 12.4 12.4 0 0 0-.339 2.406c-.022.755.062 1.368.243 1.776a.42.42 0 0 0 .426.24c.327-.034.61-.199.929-.502.212-.202.4-.423.615-.674.133-.156.276-.323.44-.504C4.861 9.969 5.978 9.027 8 9.027s3.139.942 3.965 1.855c.164.181.307.348.44.504.214.251.403.472.615.674.318.303.601.468.929.503a.42.42 0 0 0 .426-.241c.18-.408.265-1.02.243-1.776a12.4 12.4 0 0 0-.339-2.406 14 14 0 0 0-.748-2.295c-.298-.682-.61-1.19-.885-1.465-.264-.265-.856-.523-1.733-.708-.85-.179-1.877-.27-2.913-.27s-2.063.091-2.913.27"/></svg></button>
      <button type="button" class="side-item" data-nav="我的收藏" id="btnNavFav" title="我的最爱" aria-label="我的最爱"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/></svg></button>
      <div class="side-spacer"></div>
      <button type="button" class="side-item" id="btnHome" title="个人主页（暂未开放）" aria-label="个人主页（暂未开放）" disabled><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg></button>
      <button type="button" class="side-item" id="btnTheme" title="切换亮/暗主题" aria-label="切换亮/暗主题"><svg class="icon-sun" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg><svg class="icon-moon" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/></svg></button>
      <button type="button" class="side-item" id="btnSettings" title="设置" aria-label="设置"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg></button>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <div class="collection-scrim" id="collectionScrim"></div>
      <div class="collection-drawer" id="collectionDrawer">
        <div class="cd-head">
          <span class="cd-title">收藏夹</span>
          <button type="button" class="cd-new" id="btnNewCollection"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg> 新建</button>
        </div>
        <div class="collection-tree" id="collectionTree"></div>
      </div>
      <div class="navbar">
        <div class="nav-view">
          <span class="view-name" id="viewName">全部作品</span>
          <span class="view-count" id="viewCount"></span>
        </div>
        <button type="button" class="nav-collections" id="btnCollections" title="收藏夹" aria-label="收藏夹" aria-expanded="false">
          <span class="icon-collections"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 1.5A1.5 1.5 0 0 1 1.5 0h13A1.5 1.5 0 0 1 16 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5zM1.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5H5V1zM10 15V1H6v14zm1 0h3.5a.5.5 0 0 0 .5-.5v-13a.5.5 0 0 0-.5-.5H11z"/></svg></span>
          <span class="icon-collections-close"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg></span>
        </button>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9aeb9" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="searchInput" placeholder="搜索游戏、标签、开发商……" autocomplete="off" aria-label="搜索游戏">
        </div>
        <div class="navbtns">
          <button class="navbtn" id="batchBtn">批量选择</button>
          <button class="navbtn" id="filterBtn">排序 <svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/></svg></button>
        </div>
        <div class="dropdown" id="filterMenu" role="menu">
          <div class="ttl">排序</div>
          <button type="button" class="item" role="menuitem" data-sort="时间">按最近游玩</button>
          <button type="button" class="item" role="menuitem" data-sort="名称">按名称</button>
          <button type="button" class="item" role="menuitem" data-sort="评分">按评分</button>
        </div>
      </div>

      <div class="scroll"><div class="grid" id="grid"></div></div>

      <!-- 主页（默认视图）：问候/继续游玩/统计/收藏夹快捷/空库引导 -->
      <div class="home" id="homeView">
        <div class="home-head">
          <div class="home-avatar" aria-hidden="true"><svg viewBox="0 0 16 16" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg></div>
          <div class="home-greet">
            <div class="home-hello" id="homeGreet">你好</div>
            <div class="home-sub" id="homeSub"></div>
          </div>
        </div>
        <section class="home-sec" id="homeContinueSec" hidden>
          <div class="home-sec-title">继续游玩</div>
          <div class="home-cards" id="homeContinue"></div>
        </section>
        <section class="home-sec" id="homeStatsSec">
          <div class="home-sec-title">统计</div>
          <div class="home-stats" id="homeStats">
            <button type="button" class="home-stat" id="homeStatTotal"><b>0</b><span>作品总数</span></button>
            <button type="button" class="home-stat" id="homeStatFav"><b>0</b><span>收藏数</span></button>
            <div class="home-stat"><b>0 分钟</b><span>总游玩时长</span></div>
            <div class="home-stat"><b>无</b><span>最近一次游玩</span></div>
          </div>
        </section>
        <section class="home-sec" id="homeCollectionsSec" hidden>
          <div class="home-sec-title">收藏夹</div>
          <div class="home-chips" id="homeCollections"></div>
        </section>
        <div class="home-empty" id="homeEmpty" hidden>
          <h2>游戏库还是空的</h2>
          <p>扫描游戏文件夹，开始构建你的游戏库</p>
          <button type="button" class="primary" id="homeScanBtn">扫描游戏文件夹</button>
        </div>
      </div>

      <div class="empty" id="empty">
        <h2 id="emptyTitle">游戏库还是空的</h2>
        <p id="emptySub">扫描游戏文件夹，开始构建你的游戏库</p>
        <div><button class="primary" id="btnScan">扫描游戏文件夹</button>
             <button class="soft" id="btnShowAll" style="display:none">显示全部游戏</button></div>
      </div>

      <button type="button" class="fab fab-refresh" id="fabRefresh" title="刷新游戏列表" aria-label="刷新游戏列表">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" class="fab" id="fab" aria-label="添加游戏"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg></button>
      <div class="fabmenu" id="fabMenu" role="menu">
        <button type="button" class="item" id="fabAdd">手动添加单个 exe</button>
        <button type="button" class="item" id="fabScan">批量扫描游戏文件夹</button>
      </div>

      <div class="batchbar" id="batchBar">
        <span class="count" id="batchCount">已选择 0 个</span>
        <button id="btnSelAll">全选</button>
        <button id="btnBAdd">批量添加收藏夹</button>
        <button id="btnBRem">批量移除收藏夹</button>
        <button id="btnBMove">移动到收藏夹</button>
        <button id="btnBVndb">批量匹配元数据</button>
        <button id="btnBRelocate">重新定位</button>
        <button class="danger" id="btnBDel">从库中移除</button>
      </div>

      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="batch-progress" id="batchProgress" aria-live="polite">
        <div class="bp-head">
          <span class="bp-title" id="bpTitle">批量处理中…</span>
          <span class="bp-pct" id="bpPct">0%</span>
        </div>
        <div class="bp-bar"><div class="bp-fill" id="bpFill"></div></div>
        <div class="bp-sub" id="bpSub"></div>
        <button type="button" class="bp-cancel" id="bpCancel" style="display:none">取消扫描</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     各窗口 / 对话框分块 HTML：由 main.py 按 _PARTIAL_MANIFEST
     注入到本标记处（文件位于 ui/web_assets/partials/）
     ============================================================ -->
<!-- PARTIALS -->

<!-- 窗口缩放手柄（四边 + 四角） -->
<div class="resizer r-n" data-dir="n"></div>
<div class="resizer r-s" data-dir="s"></div>
<div class="resizer r-e" data-dir="e"></div>
<div class="resizer r-w" data-dir="w"></div>
<div class="resizer r-ne" data-dir="ne"></div>
<div class="resizer r-nw" data-dir="nw"></div>
<div class="resizer r-se" data-dir="se"></div>
<div class="resizer r-sw" data-dir="sw"></div>

<!-- ============================================================
     JS 模块：由 main.py 按 _JS_MANIFEST 内联为多个 script 块
     注入到本标记处（文件位于 ui/web_assets/js/，顺序即依赖顺序）
     ============================================================ -->
<!-- SCRIPTS -->
</body>
</html>
