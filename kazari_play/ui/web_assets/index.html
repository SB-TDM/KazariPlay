<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KazariPlay</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="brand"><div class="logo">☺</div><div class="name">KazariPlay</div></div>
    <div class="spacer"></div>
    <div class="winbtns">
      <button type="button" class="winbtn" aria-label="最小化" onclick="bridge&&bridge.windowMinimize()">─</button>
      <button type="button" class="winbtn" id="btnMax" aria-label="最大化" onclick="toggleMax()">□</button>
      <button type="button" class="winbtn close" aria-label="关闭窗口" onclick="bridge&&bridge.windowClose()">✕</button>
    </div>
  </div>

  <div class="row">
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
      <button type="button" class="side-item active" data-nav="全部作品">全部作品</button>
      <button type="button" class="side-item" data-nav="继续游玩">继续游玩</button>
      <button type="button" class="side-item" data-nav="我的收藏">我的收藏</button>
      <div class="side-sep"></div>
      <div class="collection-tree" id="collectionTree"></div>
      <button type="button" class="side-item" id="btnNewCollection">＋ 新建收藏夹</button>
      <div class="side-spacer"></div>
      <button type="button" class="side-item" id="btnSettings">设置</button>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <div class="navbar">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9aeb9" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="searchInput" placeholder="搜索游戏、标签、开发商……" autocomplete="off" aria-label="搜索游戏">
        </div>
        <div class="navbtns">
          <button class="navbtn" id="batchBtn">批量选择</button>
          <button class="navbtn" id="filterBtn">排序 ▾</button>
        </div>
        <div class="dropdown" id="filterMenu" role="menu">
          <div class="ttl">排序</div>
          <button type="button" class="item" role="menuitem" data-sort="时间">按添加时间</button>
          <button type="button" class="item" role="menuitem" data-sort="名称">按名称</button>
          <button type="button" class="item" role="menuitem" data-sort="评分">按评分</button>
        </div>
      </div>

      <div class="scroll"><div class="grid" id="grid"></div></div>

      <div class="empty" id="empty">
        <h2 id="emptyTitle">游戏库还是空的</h2>
        <p id="emptySub">扫描游戏文件夹，开始构建你的游戏库</p>
        <div><button class="primary" id="btnScan">扫描游戏文件夹</button>
             <button class="soft" id="btnShowAll" style="display:none">显示全部游戏</button></div>
      </div>

      <button type="button" class="fab fab-refresh" id="fabRefresh" title="刷新游戏列表" aria-label="刷新游戏列表">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" class="fab" id="fab" aria-label="添加游戏">+</button>
      <div class="fabmenu" id="fabMenu" role="menu">
        <button type="button" class="item" id="fabAdd">手动添加单个 exe</button>
        <button type="button" class="item" id="fabScan">批量扫描游戏文件夹</button>
      </div>

      <div class="batchbar" id="batchBar">
        <span class="count" id="batchCount">已选择 0 个</span>
        <button id="btnSelAll">全选</button>
        <button id="btnBAdd">批量添加收藏夹</button>
        <button id="btnBRem">批量移除收藏夹</button>
        <button id="btnBMove">移动到收藏夹</button>
        <button id="btnBVndb">批量匹配 VNDB</button>
        <button class="danger" id="btnBDel">从库中移除</button>
      </div>

      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="batch-progress" id="batchProgress" aria-live="polite">
        <div class="bp-head">
          <span class="bp-title" id="bpTitle">批量处理中…</span>
          <span class="bp-pct" id="bpPct">0%</span>
        </div>
        <div class="bp-bar"><div class="bp-fill" id="bpFill"></div></div>
        <div class="bp-sub" id="bpSub"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     各窗口 / 对话框分块 HTML：由 main.py 按 _PARTIAL_MANIFEST
     注入到本标记处（文件位于 ui/web_assets/partials/）
     ============================================================ -->
<!-- PARTIALS -->

<!-- 窗口缩放手柄（四边 + 四角） -->
<div class="resizer r-n" data-dir="n"></div>
<div class="resizer r-s" data-dir="s"></div>
<div class="resizer r-e" data-dir="e"></div>
<div class="resizer r-w" data-dir="w"></div>
<div class="resizer r-ne" data-dir="ne"></div>
<div class="resizer r-nw" data-dir="nw"></div>
<div class="resizer r-se" data-dir="se"></div>
<div class="resizer r-sw" data-dir="sw"></div>

<!-- ============================================================
     JS 模块：由 main.py 按 _JS_MANIFEST 内联为多个 script 块
     注入到本标记处（文件位于 ui/web_assets/js/，顺序即依赖顺序）
     ============================================================ -->
<!-- SCRIPTS -->
</body>
</html>
