<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{APP_TITLE}}</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="brand"><div class="logo">☺</div><div class="name">{{APP_TITLE}}</div></div>
    <div class="spacer"></div>
    <div class="winbtns">
      <button type="button" class="winbtn" aria-label="最小化" onclick="bridge&&bridge.windowMinimize()">─</button>
      <button type="button" class="winbtn" id="btnMax" aria-label="最大化" onclick="toggleMax()">□</button>
      <button type="button" class="winbtn close" aria-label="关闭窗口" onclick="bridge&&bridge.windowClose()">✕</button>
    </div>
  </div>

  <div class="row">
    <!-- 侧边栏（图标列）：导航 + 收藏夹入口 + 底部功能 -->
    <div class="sidebar" id="sidebar">
      <button type="button" class="side-item active" data-nav="全部作品" id="btnNavAll" title="全部作品" aria-label="全部作品"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/><path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/></svg></button>
      <button type="button" class="side-item" data-nav="我的收藏" id="btnNavFav" title="我的最爱" aria-label="我的最爱"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/></svg></button>
      <button type="button" class="side-item" id="btnCollections" title="收藏夹" aria-label="收藏夹" aria-expanded="false"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M0 1.5A1.5 1.5 0 0 1 1.5 0h13A1.5 1.5 0 0 1 16 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5zM1.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5H5V1zM10 15V1H6v14zm1 0h3.5a.5.5 0 0 0 .5-.5v-13a.5.5 0 0 0-.5-.5H11z"/></svg></button>
      <div class="side-spacer"></div>
      <button type="button" class="side-item" id="btnHome" title="个人主页（暂未开放）" aria-label="个人主页（暂未开放）" disabled><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg></button>
      <button type="button" class="side-item" id="btnTheme" title="切换亮/暗主题" aria-label="切换亮/暗主题"><svg class="icon-sun" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg><svg class="icon-moon" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/></svg></button>
      <button type="button" class="side-item" id="btnSettings" title="设置" aria-label="设置"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg></button>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <div class="collection-scrim" id="collectionScrim"></div>
      <div class="collection-drawer" id="collectionDrawer">
        <div class="cd-head">
          <span class="cd-title">收藏夹</span>
          <button type="button" class="cd-new" id="btnNewCollection">＋ 新建</button>
          <button type="button" class="cd-close" id="btnCollectionsClose" aria-label="收起收藏夹">‹</button>
        </div>
        <div class="collection-tree" id="collectionTree"></div>
      </div>
      <div class="navbar">
        <div class="nav-view">
          <span class="view-name" id="viewName">全部作品</span>
          <span class="view-count" id="viewCount"></span>
        </div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9aeb9" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="searchInput" placeholder="搜索游戏、标签、开发商……" autocomplete="off" aria-label="搜索游戏">
        </div>
        <div class="navbtns">
          <button class="navbtn" id="batchBtn">批量选择</button>
          <button class="navbtn" id="filterBtn">排序 ▾</button>
        </div>
        <div class="dropdown" id="filterMenu" role="menu">
          <div class="ttl">排序</div>
          <button type="button" class="item" role="menuitem" data-sort="时间">按最近游玩</button>
          <button type="button" class="item" role="menuitem" data-sort="名称">按名称</button>
          <button type="button" class="item" role="menuitem" data-sort="评分">按评分</button>
        </div>
      </div>

      <div class="scroll"><div class="grid" id="grid"></div></div>

      <div class="empty" id="empty">
        <h2 id="emptyTitle">游戏库还是空的</h2>
        <p id="emptySub">扫描游戏文件夹，开始构建你的游戏库</p>
        <div><button class="primary" id="btnScan">扫描游戏文件夹</button>
             <button class="soft" id="btnShowAll" style="display:none">显示全部游戏</button></div>
      </div>

      <button type="button" class="fab fab-refresh" id="fabRefresh" title="刷新游戏列表" aria-label="刷新游戏列表">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" class="fab" id="fab" aria-label="添加游戏">+</button>
      <div class="fabmenu" id="fabMenu" role="menu">
        <button type="button" class="item" id="fabAdd">手动添加单个 exe</button>
        <button type="button" class="item" id="fabScan">批量扫描游戏文件夹</button>
      </div>

      <div class="batchbar" id="batchBar">
        <span class="count" id="batchCount">已选择 0 个</span>
        <button id="btnSelAll">全选</button>
        <button id="btnBAdd">批量添加收藏夹</button>
        <button id="btnBRem">批量移除收藏夹</button>
        <button id="btnBMove">移动到收藏夹</button>
        <button id="btnBVndb">批量匹配元数据</button>
        <button id="btnBRelocate">重新定位</button>
        <button class="danger" id="btnBDel">从库中移除</button>
      </div>

      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="batch-progress" id="batchProgress" aria-live="polite">
        <div class="bp-head">
          <span class="bp-title" id="bpTitle">批量处理中…</span>
          <span class="bp-pct" id="bpPct">0%</span>
        </div>
        <div class="bp-bar"><div class="bp-fill" id="bpFill"></div></div>
        <div class="bp-sub" id="bpSub"></div>
        <button type="button" class="bp-cancel" id="bpCancel" style="display:none">取消扫描</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     各窗口 / 对话框分块 HTML：由 main.py 按 _PARTIAL_MANIFEST
     注入到本标记处（文件位于 ui/web_assets/partials/）
     ============================================================ -->
<!-- PARTIALS -->

<!-- 窗口缩放手柄（四边 + 四角） -->
<div class="resizer r-n" data-dir="n"></div>
<div class="resizer r-s" data-dir="s"></div>
<div class="resizer r-e" data-dir="e"></div>
<div class="resizer r-w" data-dir="w"></div>
<div class="resizer r-ne" data-dir="ne"></div>
<div class="resizer r-nw" data-dir="nw"></div>
<div class="resizer r-se" data-dir="se"></div>
<div class="resizer r-sw" data-dir="sw"></div>

<!-- ============================================================
     JS 模块：由 main.py 按 _JS_MANIFEST 内联为多个 script 块
     注入到本标记处（文件位于 ui/web_assets/js/，顺序即依赖顺序）
     ============================================================ -->
<!-- SCRIPTS -->
</body>
</html>
