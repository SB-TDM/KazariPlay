<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KazariPlay · 界面预览（Kawaii Minimal）</title>
<style>
  :root {
    /* ---- 糖果色 Token（Kawaii Minimal） ---- */
    --bg:            #fff8f5;
    --bg-soft:       #ffedf2;
    --bg-titlebar:   #fff3ee;
    --bg-sidebar:    #ffeef2;
    --bg-panel:      #ffffff;
    --bg-hover:      #fff0f4;
    --text:          #4a4358;
    --text-sub:      #9c92a8;
    --text-disabled: #c7bdc9;
    --pink:          #ff8fab;
    --pink-deep:     #ff6f91;
    --purple:        #b388ff;
    --mint:          #7fd8be;
    --yellow:        #ffd97d;
    --star:          #ffb020;
    --grad-pink:     linear-gradient(135deg,#ffb3c1,#ff8fab);
    --grad-purple:   linear-gradient(135deg,#c4b5fd,#b388ff);
    --grad-mint:     linear-gradient(135deg,#b5ead7,#7fd8be);
    --radius-lg:     18px;
    --radius-md:     12px;
    --card-w:        154px;
    --card-h:        210px;
    --titlebar-h:    40px;
    --sidebar-w:     140px;
    --nav-h:         44px;
    --bounce:        cubic-bezier(.34,1.56,.64,1);
    --soft:          cubic-bezier(.22,.9,.36,1);
    --font: "Microsoft YaHei UI", "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-cute: "Comic Sans MS", "Segoe Print", "Chalkboard SE", "Microsoft YaHei UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: linear-gradient(160deg, var(--bg), var(--bg-soft));
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: linear-gradient(160deg, #fffaf7, #ffedf2);
    user-select: none;
  }

  /* ============ 顶部标题栏 ============ */
  .titlebar {
    height: var(--titlebar-h);
    background: var(--bg-titlebar);
    border-bottom: 1px solid rgba(255,143,171,.18);
    display: flex;
    align-items: center;
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 100%; cursor: default; }
  .brand .logo {
    width: 22px; height: 22px; border-radius: 8px;
    background: var(--grad-pink);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px;
    box-shadow: 0 2px 6px rgba(255,111,145,.4);
  }
  .brand .name {
    font-family: var(--font-cute);
    font-size: 14px; color: var(--pink-deep); font-weight: 700;
    letter-spacing: .5px;
  }
  .titlebar .spacer { flex: 1; }
  .winbtns { display: flex; height: 100%; }
  .winbtn {
    width: 46px; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-sub); font-size: 14px; cursor: default;
    border-radius: 10px; margin: 2px 0;
    transition: background .2s var(--soft), color .2s;
  }
  .winbtn:hover { background: rgba(255,143,171,.22); color: var(--pink-deep); }
  .winbtn.close:hover { background: #ffb3bd; color: #fff; }

  /* ============ 主体行（侧边栏 + 主区域） ============ */
  .row { flex: 1; display: flex; min-height: 0; }

  /* ---- 二级导航栏（主区域内） ---- */
  .navbar {
    height: var(--nav-h);
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(6px);
    display: flex; align-items: center;
    padding: 0 16px; gap: 10px;
    flex: none; position: relative;
    border-bottom: 1px solid rgba(255,143,171,.16);
  }
  .search {
    flex: 1; max-width: 460px; margin: 0 auto;
    display: flex; align-items: center;
    background: #fff;
    border: 1.5px solid #ffd7e0; border-radius: 50px;
    height: 32px; padding: 0 14px; gap: 6px;
    box-shadow: inset 0 1px 3px rgba(255,143,171,.12);
    transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,143,171,.18); }
  .search svg { flex: none; }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font); font-size: 13px;
  }
  .search input::placeholder { color: var(--text-disabled); }

  .navbtns { display: flex; gap: 8px; flex: none; }
  .navbtn {
    height: 32px; padding: 0 14px;
    display: flex; align-items: center; gap: 6px;
    background: #fff;
    border: 1.5px solid #ffd7e0; border-radius: 50px;
    color: var(--text-sub); font-size: 13px;
    cursor: pointer; font-family: var(--font);
    transition: all .22s var(--bounce);
  }
  .navbtn:hover { transform: translateY(-2px); border-color: var(--pink); color: var(--pink-deep); box-shadow: 0 4px 10px rgba(255,143,171,.25); }
  .navbtn.active {
    color: #fff; border-color: transparent;
    background: var(--grad-pink);
    box-shadow: 0 4px 12px rgba(255,111,145,.4);
  }
  .navbtn.active:hover { color: #fff; }

  /* ---- 侧边栏 ---- */
  .sidebar {
    width: var(--sidebar-w); flex: none;
    background: var(--bg-sidebar);
    border-right: 1px solid rgba(255,143,171,.14);
    display: flex; flex-direction: column;
    padding: 8px 6px;
  }
  .side-item {
    display: flex; align-items: center; gap: 9px;
    height: 38px; padding: 0 12px;
    color: var(--text-sub); font-size: 13px;
    cursor: pointer;
    border-radius: 50px;
    transition: all .22s var(--soft);
  }
  .side-item svg { flex: none; }
  .side-item:hover { background: rgba(255,255,255,.8); color: var(--pink-deep); transform: translateX(2px); }
  .side-item.active {
    color: #fff;
    background: var(--grad-pink);
    box-shadow: 0 3px 10px rgba(255,111,145,.35);
  }
  .side-sep { height: 1px; background: rgba(255,143,171,.18); margin: 8px 10px; border-radius: 1px; }
  .side-spacer { flex: 1; }

  /* ---- 主区域 ---- */
  .main {
    flex: 1; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }

  .scroll {
    flex: 1; overflow-y: auto; padding: 24px 28px 90px;
  }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #f0cfd9; border-radius: 4px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: #ffb3c1; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
    gap: 14px;
    justify-content: start;
  }

  /* ---- 游戏卡片 ---- */
  .card {
    width: var(--card-w); height: var(--card-h);
    border-radius: var(--radius-lg);
    background: var(--bg-panel);
    overflow: hidden; position: relative;
    cursor: pointer;
    border: 1.5px solid #ffe3ea;
    box-shadow: 0 4px 12px rgba(255,143,171,.14);
    transition: transform .25s var(--bounce), box-shadow .25s var(--soft), border-color .25s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--pink);
    box-shadow: 0 10px 22px rgba(255,111,145,.28);
  }
  .card .cover { height: calc(100% - 31px); position: relative; }
  .card .cover::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(255,255,255,.94), rgba(255,255,255,0) 55%);
  }
  .card .ctitle {
    position: absolute; left: 0; right: 0; bottom: 31px;
    padding: 4px 10px 8px;
    font-size: 13px; line-height: 1.3; color: var(--text);
    z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
  }
  .card .meta {
    height: 31px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 12px; color: var(--text-sub);
    background: #fff;
    white-space: nowrap; overflow: hidden;
  }
  .card .meta .dev { overflow: hidden; text-overflow: ellipsis; }
  .card .stars { color: var(--star); font-size: 12px; letter-spacing: 1px; flex: none; text-shadow: 0 1px 2px rgba(255,176,32,.2); }
  .card .fav {
    position: absolute; top: 6px; right: 9px; z-index: 3;
    font-size: 14px; color: var(--star);
    filter: drop-shadow(0 1px 3px rgba(255,176,32,.5));
  }

  /* ---- 批量选择模式：圆形选择框 ---- */
  .card .check {
    position: absolute; right: 8px; bottom: 8px; z-index: 3;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #c9aeb9;
    background: rgba(255,255,255,.9);
    display: none; align-items: center; justify-content: center;
    transition: all .2s var(--bounce);
  }
  body.batch .card .check { display: flex; }
  body.batch .card:hover { transform: translateY(-3px); }
  .card.selected {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,111,145,.25), 0 8px 18px rgba(255,111,145,.3);
  }
  .card.selected .check {
    background: var(--grad-pink); border-color: transparent;
    transform: scale(1.1);
  }

  /* ---- FAB ---- */
  .fab {
    position: absolute; right: 26px; bottom: 26px; z-index: 20;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--grad-pink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(255,111,145,.45);
    cursor: pointer; font-size: 27px; font-weight: 400;
    transition: transform .25s var(--bounce), box-shadow .25s;
  }
  .fab:hover { transform: scale(1.12) rotate(90deg); box-shadow: 0 12px 26px rgba(255,111,145,.55); }
  .fabmenu {
    position: absolute; right: 30px; bottom: 92px; z-index: 21;
    background: #fff; border: 1.5px solid #ffd7e0; border-radius: var(--radius-md);
    padding: 6px; display: none; min-width: 200px;
    box-shadow: 0 12px 28px rgba(255,111,145,.25);
  }
  .fabmenu.show { display: block; }
  .fabmenu .item {
    padding: 9px 14px; border-radius: 10px; font-size: 13px;
    color: var(--text); cursor: pointer;
    transition: background .2s;
  }
  .fabmenu .item:hover { background: var(--bg-hover); color: var(--pink-deep); }

  /* ---- 批量操作工具栏 ---- */
  .batchbar {
    position: absolute; left: 50%; transform: translate(-50%, 16px);
    bottom: 24px; z-index: 30;
    display: none; align-items: center; gap: 6px;
    background: rgba(255,255,255,.96);
    border: 1.5px solid #ffd7e0; border-radius: 50px;
    padding: 8px 14px;
    box-shadow: 0 14px 32px rgba(255,111,145,.28);
    opacity: 0; transition: opacity .22s, transform .28s var(--bounce);
  }
  body.batch .batchbar { display: flex; opacity: 1; transform: translate(-50%, 0); }
  .batchbar .count {
    font-size: 13px; color: var(--pink-deep); font-weight: 700;
    padding-right: 10px; border-right: 1px solid #f4d8e0; margin-right: 4px;
    min-width: 84px;
  }
  .batchbar button {
    height: 30px; padding: 0 14px;
    background: transparent; color: var(--text-sub);
    border: 1.5px solid #f3dde5; border-radius: 50px;
    font-size: 13px; font-family: var(--font); cursor: pointer;
    transition: all .22s var(--bounce); white-space: nowrap;
  }
  .batchbar button:hover { transform: translateY(-2px); background: var(--bg-hover); color: var(--pink-deep); border-color: var(--pink); }
  .batchbar button:disabled { color: var(--text-disabled); cursor: default; }
  .batchbar button:disabled:hover { transform: none; background: transparent; border-color: #f3dde5; }
  .batchbar .danger:hover { border-color: #ff8b98; color: #ff6f81; background: #fff0f2; }

  /* ---- 下拉菜单（筛选） ---- */
  .dropdown {
    position: absolute; right: 16px; top: var(--nav-h);
    background: #fff; border: 1.5px solid #ffd7e0; border-radius: var(--radius-md);
    padding: 6px; display: none; z-index: 40; min-width: 210px;
    box-shadow: 0 12px 28px rgba(255,111,145,.25);
  }
  .dropdown.show { display: block; }
  .dropdown .ttl { padding: 6px 12px 3px; font-size: 11px; color: var(--text-disabled); }
  .dropdown .item {
    padding: 8px 12px; border-radius: 10px; font-size: 13px;
    color: var(--text); cursor: pointer;
    transition: background .2s;
  }
  .dropdown .item:hover { background: var(--bg-hover); }
  .dropdown .item.on { color: var(--pink-deep); font-weight: 600; }

  /* ---- Toast ---- */
  .toast {
    position: absolute; top: calc(var(--nav-h) + 12px); left: 50%;
    transform: translateX(-50%); z-index: 99;
    background: #fff; border: 1.5px solid #ffd7e0; border-radius: 50px;
    padding: 9px 20px; font-size: 13px; color: var(--pink-deep);
    box-shadow: 0 10px 24px rgba(255,111,145,.3);
    opacity: 0; transition: opacity .25s, transform .25s var(--bounce);
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(2px); }

  /* ============ 模态底部抽屉 Modal Bottom Sheet ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(74,57,84,.45);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0;
    overflow: hidden;
    opacity: 0; visibility: hidden;
    transition: opacity .28s var(--soft), visibility 0s linear .28s;
  }
  .overlay.show {
    opacity: 1; visibility: visible;
    transition: opacity .28s var(--soft);
  }
  .overlay.show .dialog { animation: sheetUp .34s var(--soft); }
  .dialog.closing { animation: sheetDown .28s var(--soft) forwards; }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes sheetDown {
    from { transform: translateY(0); }
    to   { transform: translateY(100%); }
  }

  .dialog {
    position: relative;
    width: 100%;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px 20px 0 0;
    border: 1.5px solid #ffe3ea;
    border-bottom: none;
    box-shadow: 0 -14px 44px rgba(120,70,110,.32);
    display: flex; flex-direction: column;
    overflow: hidden;
    max-height: 90vh;
  }
  /* 顶部拖拽手柄 */
  .dialog::before {
    content: "";
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 4px; border-radius: 2px;
    background: #e6d5dd;
    z-index: 3;
  }

  /* ---- 详情底部抽屉（视图 B） ---- */
  .dialog.detail {
    max-width: 1000px;
    flex-direction: row;
    padding-top: 20px;
  }
  .detail-cover {
    flex: none; width: 240px; position: relative;
    aspect-ratio: 154 / 179;   /* 对齐标准卡片封面区比例 */
    align-self: flex-start;
    padding: 0;
  }
  .detail-body {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    padding: 14px 22px 20px;
  }
  .detail-head { display: flex; align-items: flex-start; gap: 10px; }
  .detail-head h2 {
    flex: 1; font-size: 20px; font-weight: 700; color: var(--text);
    line-height: 1.3;
  }
  .close-btn {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: var(--bg-hover); color: var(--text-sub);
    font-size: 15px; cursor: pointer; font-family: var(--font);
    transition: all .2s var(--bounce);
  }
  .close-btn:hover { background: #ffb3bd; color: #fff; transform: rotate(90deg); }

  .info-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 16px;
    margin-top: 12px;
  }
  .info-item { font-size: 12.5px; color: var(--text-sub); }
  .info-item b { color: var(--text); font-weight: 600; margin-right: 4px; }

  .detail-actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .pill-btn {
    height: 34px; padding: 0 18px; border-radius: 50px;
    border: 1.5px solid #ffd7e0; background: #fff;
    color: var(--text-sub); font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: all .22s var(--bounce);
  }
  .pill-btn:hover { transform: translateY(-2px); color: var(--pink-deep); border-color: var(--pink); box-shadow: 0 4px 10px rgba(255,143,171,.25); }
  .pill-btn.primary {
    border: none; color: #fff;
    background: var(--grad-pink);
    box-shadow: 0 4px 12px rgba(255,111,145,.4);
  }
  .pill-btn.primary:hover { color: #fff; }
  .pill-btn.fav.on { color: var(--star); border-color: var(--star); }

  .tags-row {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 14px;
  }
  .chip {
    height: 24px; padding: 0 12px; border-radius: 50px;
    font-size: 12px; display: inline-flex; align-items: center; gap: 5px;
  }
  .chip .x { cursor: pointer; opacity: .6; font-weight: 700; }
  .chip .x:hover { opacity: 1; }
  .chip.manage {
    background: #fff; border: 1.5px dashed var(--pink); color: var(--pink-deep);
    cursor: pointer; transition: all .2s var(--bounce);
  }
  .chip.manage:hover { background: var(--bg-hover); transform: translateY(-1px); }

  .detail-desc {
    margin-top: 12px; overflow-y: auto; max-height: 96px;
    font-size: 13px; line-height: 1.7; color: var(--text-sub);
    padding-right: 6px;
  }
  .detail-desc::-webkit-scrollbar { width: 6px; }
  .detail-desc::-webkit-scrollbar-thumb { background: #f0cfd9; border-radius: 3px; }

  .more-wrap { position: relative; }
  .more-menu {
    position: absolute; right: 0; top: 40px; z-index: 5;
    background: #fff; border: 1.5px solid #ffd7e0; border-radius: var(--radius-md);
    padding: 5px; min-width: 150px; display: none;
    box-shadow: 0 10px 24px rgba(255,111,145,.25);
  }
  .more-menu.show { display: block; }
  .more-menu .item { padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  .more-menu .item:hover { background: var(--bg-hover); color: var(--pink-deep); }
  .more-menu .item.danger:hover { color: #ff6f81; background: #fff0f2; }

  /* ---- 标签管理底部抽屉 ---- */
  .dialog.tagmgr { max-width: 480px; padding: 26px 22px 20px; }
  .dialog .dlg-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 16px; font-weight: 700; color: var(--text);
  }
  .section-ttl {
    margin: 16px 0 8px; font-size: 12px; color: var(--text-disabled);
    display: flex; justify-content: space-between; align-items: center;
  }
  .taglist { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
  .catlist { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-item {
    height: 28px; padding: 0 14px; border-radius: 50px;
    border: 1.5px solid #ffd7e0; background: #fff; color: var(--text-sub);
    font-size: 12.5px; cursor: pointer; transition: all .2s var(--soft);
  }
  .cat-item:hover { border-color: var(--pink); color: var(--pink-deep); }
  .cat-item.on { background: var(--grad-mint); border-color: transparent; color: #fff; }

  .tagform { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .tagform input {
    flex: 1; height: 32px; border: 1.5px solid #ffd7e0; border-radius: 50px;
    padding: 0 14px; font-size: 13px; font-family: var(--font); color: var(--text);
    outline: none; background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }
  .tagform input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,143,171,.18); }
  .color-row { display: flex; gap: 6px; }
  .color-dot {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all .2s var(--bounce);
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.on { border-color: #4a4358; box-shadow: 0 0 0 2px #fff inset; }

  .dlg-foot {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;
  }

  /* 窄屏：详情弹窗上下布局（计划书 4.2 自适应） */
  @media (max-width: 640px) {
    .dialog.detail { flex-direction: column; width: 100%; }
    .detail-cover { width: 100%; height: 200px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 顶部标题栏 -->
  <div class="titlebar">
    <div class="brand">
      <div class="logo">☺</div>
      <div class="name">KazariPlay</div>
    </div>
    <div class="spacer"></div>
    <div class="winbtns">
      <div class="winbtn" title="最小化">─</div>
      <div class="winbtn" title="最大化">□</div>
      <div class="winbtn close" title="关闭">✕</div>
    </div>
  </div>

  <!-- 主体行 -->
  <div class="row">
    <!-- 侧边栏 -->
    <div class="sidebar">

  { t: "素晴らしき日々", d: "ケロQ", e: "KRKR", yr: "2010", time: "35 小时", last: "3 天前", r: 5, fav: false, tags: ["电波", "哲学", "猎奇"], desc: "电波系名作。六个视角交错叙述，从『坠落的少女』到『无与伦比之日』，主题深奥，音乐与画面皆为经典。", g: "linear-gradient(160deg,#cde9ff,#9ac7ee 50%,#7aa5d0)" },
  { t: "CLANNAD", d: "Key", e: "RealLive", yr: "2004", time: "60 小时", last: "1 个月前", r: 5, fav: true,  tags: ["催泪", "校园", "纯爱"], desc: "Key 社泣系代表。冈崎朋也与古河渚的家族物语，春之篇与苍之世界的传说，无数玩家心中的神作。", g: "linear-gradient(160deg,#ffe8b8,#ffd488)" },
  { t: "Ever17", d: "KID", e: "RealLive", yr: "2002", time: "25 小时", last: "从未游玩", r: 4, fav: false, tags: ["悬疑", "科幻", "SF"], desc: "水世界水下主题乐园的密室逃脱。双视角叙事 + 核心诡计，解谜时段的氛围营造堪称教科书。", g: "linear-gradient(160deg,#a8cbe8,#6f9cc9)" },
  { t: "STEINS;GATE", d: "5pb.", e: "Ren'Py", yr: "2009", time: "40 小时", last: "昨天", r: 5, fav: true,  tags: ["科幻", "时间旅行", "汉化"], desc: "命运石之门。关于时间旅行与记忆的科幻杰作，中二病主角冈部伦太郎的疯狂科学者物语。", g: "linear-gradient(160deg,#b5e0c4,#7fb89a)" },
  { t: "白色相簿2", d: "leaf", e: "RealLive", yr: "2010", time: "55 小时", last: "1 周前", r: 4, fav: false, tags: ["恋爱", "白学", "三角"], desc: "届かない恋。以冬马和纱、小木曾雪菜、北原春希的三角关系为主线，纠结细腻的青春恋爱剧。", g: "linear-gradient(160deg,#f0f0f4,#c3c9d4)" },

  { t: "月姫", d: "TYPE-MOON", e: "KRKR", yr: "2000", time: "28 小时", last: "从未游玩", r: 3, fav: false, tags: ["吸血鬼", "悬疑"], desc: "型月早期名作。退魔家族后裔远野志贵与真祖爱尔奎特的故事，蘑菇世界观的原点。", g: "linear-gradient(160deg,#cfc3ea,#a08bc9)" },
  { t: "近月少女的礼仪", d: "Navel", e: "Ren'Py", yr: "2012", time: "20 小时", last: "5 天前", r: 4, fav: false, tags: ["女装", "学园", "汉化"], desc: "大藏游星男扮女装潜入樱小路露娜所在的少女学园，华丽礼服与礼仪之争，露娜线惊艳四座。", g: "linear-gradient(160deg,#ffc9da,#e88aaa)" },
  { t: "缘之空", d: "Sphere", e: "KRKR", yr: "2008", time: "12 小时", last: "从未游玩", r: 2, fav: false, tags: ["兄妹", "实妹"], desc: "春日野穹与悠的乡间夏日。『穹线』相关话题历久不衰，改编动画也广为人知。", g: "linear-gradient(160deg,#c4efe2,#7fc9b5)" },
  { t: "心跳文学部", d: "Team Salvato", e: "Ren'Py", yr: "2017", time: "8 小时", last: "1 个月前", r: 3, fav: false, tags: ["meta", "恐怖", "心理"], desc: "披着校园恋爱皮的 meta 恐怖作品。第四面墙的运用与心理压迫感独树一帜，免费却极具冲击力。", g: "linear-gradient(160deg,#ffd0d0,#f0a0b8)" },
  { t: "装甲恶鬼村正", d: "Nitroplus", e: "KRKR", yr: "2009", time: "90 小时", last: "3 个月前", r: 4, fav: true,  tags: ["史诗", "剑戟", "汉化"], desc: "奈良原一铁长篇剑剧。善恶二元论的追问贯穿全篇，超长文本量，恶鬼村正的漫长旅程。", g: "linear-gradient(160deg,#c4b8a8,#8a8074)" },
];

// 糖果色 chips（循环分配）
const TAG_COLORS = ['#ffb3c1', '#c4b5fd', '#b5ead7', '#ffd97d', '#ffc9a0'];

// 真实封面图（本地 preview_images/，循环分配）
const COVERS = [
  'preview_images/cover1.jpg',
  'preview_images/cover2.jpg',
  'preview_images/cover3.png',
];
GAMES.forEach((g, i) => { g.cover = COVERS[i % COVERS.length]; });

const grid = document.getElementById('grid');
const batchBar = document.getElementById('batchBar');
const batchCount = document.getElementById('batchCount');
const batchBtn = document.getElementById('batchBtn');
const toast = document.getElementById('toast');

let batchMode = false;
let selected = new Set();
let allSelected = false;

function stars(r) {
  const filled = '★★★★★', empty = '☆☆☆☆☆';
  const n = Math.max(0, Math.min(5, r || 0));
  return filled.slice(0, n) + empty.slice(0, 5 - n);
}
function chipColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) % 997;
  return TAG_COLORS[h % TAG_COLORS.length];
}

// 渲染卡片
function renderCards(list) {
  grid.innerHTML = '';
  list.forEach(g => {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.title = g.t;
    card.innerHTML = `
      <div class="cover" style="background:url('${g.cover}') center/cover no-repeat, ${g.g}">
        ${g.fav ? '<span class="fav">★</span>' : ''}
        <div class="ctitle">${g.t}</div>
        <span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"><path d="M4 12l5 5L20 6"/></svg></span>
      </div>
      <div class="meta"><span class="dev">${g.d}</span><span class="stars">${stars(g.r)}</span></div>
    `;
    card.addEventListener('click', () => {
      if (batchMode) toggleSelect(card);
      else openDetail(g);
    });
    grid.appendChild(card);
  });
}
renderCards(GAMES);

function toggleSelect(card) {
  const id = card.dataset.title;
  if (selected.has(id)) { selected.delete(id); card.classList.remove('selected'); }
  else { selected.add(id); card.classList.add('selected'); }
  updateBatchBar();
}

function updateBatchBar() {
  const n = selected.size;
  batchCount.textContent = `已选择 ${n} 个`;
  batchBar.querySelectorAll('button:not(#btnSelAll)').forEach(b => b.disabled = n === 0);
  allSelected = n === GAMES.length;
  document.getElementById('btnSelAll').textContent = allSelected ? '取消全选' : '全选';
}

// 批量选择模式开关
function setBatch(on) {
  batchMode = on;
  document.body.classList.toggle('batch', on);
  batchBtn.classList.toggle('active', on);
  if (on) {
    selected.clear();
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    updateBatchBar();
  } else {
    selected.clear();
  }
}
batchBtn.addEventListener('click', () => setBatch(!batchMode));

// 全选 / 取消全选
document.getElementById('btnSelAll').addEventListener('click', () => {
  if (allSelected) {
    selected.clear();
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  } else {
    document.querySelectorAll('.card').forEach(c => { c.classList.add('selected'); selected.add(c.dataset.title); });
  }
  updateBatchBar();
});

// 批量操作（占位）
[['btnAddTag','批量添加标签'],['btnRemTag','批量移除标签'],['btnMove','移动至分组'],['btnRemove','从库中移除']].forEach(([id, name]) => {
  document.getElementById(id).addEventListener('click', () => {
    if (selected.size === 0) return;
    const tip = name === '从库中移除' ? `从库中移除 ${selected.size} 个游戏？(二次确认)` : `${name}：${[...selected].join('、')}`;
    showToast(tip);
  });
});

// 侧边栏导航
document.querySelectorAll('.side-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    if (item.dataset.nav !== '设置' && item.dataset.nav !== '新建分组') {
      showToast('切换视图：' + item.dataset.nav);
    } else {
      showToast(item.dataset.nav === '设置' ? '打开设置对话框（待实现）' : '新建分组（待实现）');
    }
  });
});

// 筛选下拉
const filterBtn = document.getElementById('filterBtn');
const filterMenu = document.getElementById('filterMenu');
filterBtn.addEventListener('click', e => { e.stopPropagation(); filterMenu.classList.toggle('show'); });
filterMenu.querySelectorAll('.item').forEach(it => {
  it.addEventListener('click', () => {
    filterMenu.querySelectorAll('.item').forEach(x => x.classList.remove('on'));
    it.classList.add('on');
    filterMenu.classList.remove('show');
    showToast('筛选：' + it.textContent);
  });
});

// FAB 菜单
const fab = document.getElementById('fab');
const fabMenu = document.getElementById('fabMenu');
fab.addEventListener('click', e => { e.stopPropagation(); fabMenu.classList.toggle('show'); });
fabMenu.querySelectorAll('.item').forEach(it => {
  it.addEventListener('click', () => { fabMenu.classList.remove('show'); showToast(it.textContent + '（待实现）'); });
});

// 搜索过滤
document.getElementById('searchInput').addEventListener('input', e => {
  const kw = e.target.value.trim();
  const list = kw ? GAMES.filter(g => g.t.includes(kw) || g.d.includes(kw)) : GAMES;
  renderCards(list);
});

// ============ 详情弹窗（视图 B） ============
const detailOverlay = document.getElementById('detailOverlay');
const detailDialog = document.getElementById('detailDialog');
const dlgCover = document.getElementById('dlgCover');
const dlgTitle = document.getElementById('dlgTitle');
const dlgInfo = document.getElementById('dlgInfo');
const dlgTags = document.getElementById('dlgTags');
const dlgDesc = document.getElementById('dlgDesc');
const dlgFav = document.getElementById('dlgFav');
const dlgMoreMenu = document.getElementById('dlgMoreMenu');
let currentGame = null;

function openDetail(g) {
  currentGame = g;
  dlgCover.style.background = `url('${g.cover}') center/cover no-repeat, ${g.g}`;
  dlgTitle.textContent = g.t;
  dlgInfo.innerHTML = `
    <div class="info-item"><b>开发商</b>${g.d}</div>
    <div class="info-item"><b>引擎</b>${g.e}</div>
    <div class="info-item"><b>发售日</b>${g.yr}</div>
    <div class="info-item"><b>游玩时长</b>${g.time}</div>
    <div class="info-item"><b>上次游玩</b>${g.last}</div>
    <div class="info-item"><b>评分</b><span class="stars" style="color:var(--star);letter-spacing:1px;">${stars(g.r)}</span></div>
  `;
  renderDetailTags();
  dlgDesc.textContent = g.desc;
  updateFavBtn();
  detailOverlay.classList.add('show');
  dlgMoreMenu.classList.remove('show');
}

function renderDetailTags() {
  dlgTags.innerHTML = '';
  (currentGame.tags || []).forEach(t => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.style.background = chipColor(t);
    c.style.color = '#4a4358';
    c.innerHTML = `${t}<span class="x" data-tag="${t}">✕</span>`;
    c.querySelector('.x').addEventListener('click', e => {
      e.stopPropagation();
      currentGame.tags = currentGame.tags.filter(x => x !== t);
      renderDetailTags();
      showToast(`已移除标签：${t}`);
    });
    dlgTags.appendChild(c);
  });
  const manage = document.createElement('span');
  manage.className = 'chip manage';
  manage.textContent = '＋ 管理标签';
  manage.addEventListener('click', () => openTagManager());
  dlgTags.appendChild(manage);
}

function updateFavBtn() {
  dlgFav.textContent = currentGame.fav ? '★ 已收藏' : '☆ 收藏';
  dlgFav.classList.toggle('on', currentGame.fav);
}

function closeDetail() {
  if (!detailOverlay.classList.contains('show')) return;
  detailDialog.classList.add('closing');
  detailOverlay.classList.remove('show');
  setTimeout(() => detailDialog.classList.remove('closing'), 300);
}

document.getElementById('dlgClose').addEventListener('click', closeDetail);
document.getElementById('dlgStart').addEventListener('click', () => showToast(`正在启动：${currentGame.t}（模拟）`));
document.getElementById('dlgEdit').addEventListener('click', () => showToast('打开编辑对话框（待实现）'));
document.getElementById('dlgFav').addEventListener('click', () => {
  currentGame.fav = !currentGame.fav;
  updateFavBtn();
  showToast(currentGame.fav ? '已添加收藏' : '已取消收藏');
});
document.getElementById('dlgMore').addEventListener('click', e => { e.stopPropagation(); dlgMoreMenu.classList.toggle('show'); });
dlgMoreMenu.querySelectorAll('.item').forEach(it => {
  it.addEventListener('click', () => {
    dlgMoreMenu.classList.remove('show');
    if (it.dataset.act === '打开目录') showToast('在资源管理器中打开目录（模拟）');
    else showToast(`确认删除「${currentGame.t}」？(二次确认)`);
  });
});

// 点击遮罩空白关闭
detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) closeDetail(); });

// ============ 标签管理对话框 ============
const tagOverlay = document.getElementById('tagOverlay');
const tagList = document.getElementById('tagList');
const tagCount = document.getElementById('tagCount');
const tagName = document.getElementById('tagName');
const tagAdd = document.getElementById('tagAdd');
const colorRow = document.getElementById('colorRow');

let palette = [...TAG_COLORS, '#a8e6cf'];
let chosenColor = TAG_COLORS[0];
let tags = ['恋爱', '纯爱', '汉化', '悬疑', 'RPG', '科幻', '催泪', '猎奇'];

// 颜色选择器
palette.forEach((col, i) => {
  const dot = document.createElement('span');
  dot.className = 'color-dot' + (i === 0 ? ' on' : '');
  dot.style.background = col;
  dot.addEventListener('click', () => {
    colorRow.querySelectorAll('.color-dot').forEach(d => d.classList.remove('on'));
    dot.classList.add('on');
    chosenColor = col;
  });
  colorRow.appendChild(dot);
});

function renderTagList() {
  tagList.innerHTML = '';
  tags.forEach((t, idx) => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.style.background = chipColor(t);
    c.style.color = '#4a4358';
    c.innerHTML = `${t}<span class="x">✕</span>`;
    c.querySelector('.x').addEventListener('click', () => {
      tags = tags.filter(x => x !== t);
      renderTagList();
      showToast(`已删除标签：${t}`);
    });
    tagList.appendChild(c);
  });
  tagCount.textContent = `${tags.length} 个`;
}

function openTagManager() { tagOverlay.classList.add('show'); }

function closeTagManager() {
  if (!tagOverlay.classList.contains('show')) return;
  const d = tagOverlay.querySelector('.dialog');
  d.classList.add('closing');
  tagOverlay.classList.remove('show');
  setTimeout(() => d.classList.remove('closing'), 300);
}

document.getElementById('tagClose').addEventListener('click', closeTagManager);
document.getElementById('tagDone').addEventListener('click', closeTagManager);

tagAdd.addEventListener('click', () => {
  const name = tagName.value.trim();
  if (!name) return;
  if (tags.includes(name)) { showToast('标签已存在'); return; }
  tags.push(name);
  renderTagList();
  tagName.value = '';
  showToast(`已创建标签：${name}`);
});
tagName.addEventListener('keydown', e => { if (e.key === 'Enter') tagAdd.click(); });

// 分类单选
document.querySelectorAll('.cat-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    showToast('分类：' + btn.textContent);
  });
});

renderTagList();

// 点击空白关闭弹层
document.addEventListener('click', () => {
  filterMenu.classList.remove('show');
  fabMenu.classList.remove('show');
  dlgMoreMenu.classList.remove('show');
});

// Esc：批量退出 > 详情 > 标签管理
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (batchMode) { setBatch(false); return; }
  if (tagOverlay.classList.contains('show')) { closeTagManager(); return; }
  if (detailOverlay.classList.contains('show')) closeDetail();
});

// Toast
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
</script>
</body>
</html>
