<!-- 设置窗口（main.py 注入到 index.html 的 PARTIALS 标记处，逻辑在 js/settings.js） -->

<div class="overlay center" id="settingsOverlay">
  <div class="dialog settings">
    <div class="dlg-head">
      <h3><span class="cog"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg></span> 设置</h3>
      <button class="close-btn" id="setClose" aria-label="关闭设置"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="dlg-nav" id="setNav">
        <button class="nav-item active" data-tab="general">常规</button>
        <button class="nav-item" data-tab="theme">主题</button>
        <button class="nav-item" data-tab="hotkey">快捷键</button>
        <button class="nav-item" data-tab="disguise">伪装</button>
        <button class="nav-item" data-tab="metadata">元数据</button>
        <button class="nav-item" data-tab="about">关于</button>
      </div>
      <div class="dlg-content">
        <div class="page" id="set-general">
          <div class="group">
            <div class="g-title">启动</div>
            <div class="form-row" style="margin-top:6px">
              <label class="label" for="setCoverSize">封面尺寸</label>
              <div class="field"><select id="setCoverSize"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select></div>
            </div>
          </div>
            <div class="group">
              <div class="g-title">日志</div>
              <div class="form-row">
                <label class="label" for="setLogLevel">日志级别</label>
                <div class="field"><select id="setLogLevel"><option>DEBUG</option><option selected>INFO</option><option>WARNING</option><option>ERROR</option></select></div>
              </div>
              <div class="form-row" style="margin-top:6px">
                <label class="label" for="setShowConsole">显示日志窗口</label>
                <div class="field">
                  <label class="switch"><input type="checkbox" id="setShowConsole" aria-label="显示日志窗口"><span class="track"><span class="thumb"></span></span></label>
                  <span class="desc">启动时是否打开命令提示符</span>
                </div>
              </div>
            </div>
        </div>
        <div class="page" id="set-theme" style="display:none">
          <div class="group">
            <div class="g-title">主题模式（选择即保存）</div>
            <div class="theme-cards">
              <button type="button" class="theme-card light" data-card="light" onclick="Settings.pickTheme('light')">
                <div class="sw"><div class="bar"></div><div class="body"></div></div>
                <div class="lbl">浅色 · Kawaii 主推</div>
              </button>
              <button type="button" class="theme-card dark" data-card="dark" onclick="Settings.pickTheme('dark')">
                <div class="sw"><div class="bar"></div><div class="body"></div></div>
                <div class="lbl">深色 · 夜间模式</div>
              </button>
            </div>
          </div>
        </div>
        <div class="page" id="set-hotkey" style="display:none">
          <div class="group">
            <div class="g-title">全局快捷键（点击后按下组合键，保存后立即生效）</div>
            <div class="form-row"><label class="label" for="setHkHide">紧急隐藏</label><div class="field"><input type="text" id="setHkHide" class="hotkey" readonly aria-label="紧急隐藏快捷键"></div></div>
            <div class="form-row" style="margin-top:6px"><label class="label" for="setHkFull">全屏切换</label><div class="field"><input type="text" id="setHkFull" class="hotkey" readonly aria-label="全屏切换快捷键"></div></div>
            <div class="form-row" style="margin-top:6px"><label class="label" for="setHkMute">游戏静音</label><div class="field"><input type="text" id="setHkMute" class="hotkey" readonly aria-label="游戏静音快捷键"></div></div>
            <div class="form-row" style="margin-top:6px"><label class="label" for="setHkShot">游戏截图</label><div class="field"><input type="text" id="setHkShot" class="hotkey" readonly aria-label="游戏截图快捷键"></div></div>
          </div>
        </div>
        <div class="page" id="set-disguise" style="display:none">
          <div class="group">
            <div class="g-title">避险伪装</div>
            <div class="form-row">
              <label class="label" for="setDisguise">伪装场景</label>
              <div class="field"><select id="setDisguise"><option value="excel" selected>Excel</option><option value="word">Word</option><option value="browser">浏览器</option></select></div>
            </div>
            <div class="form-row"><div class="desc" style="padding-left:96px">触发紧急隐藏时，窗口伪装为所选场景。</div></div>
          </div>
        </div>
        <div class="page" id="set-metadata" style="display:none">
          <div class="group">
            <div class="g-title">混合检索数据源</div>
            <div class="form-row"><div class="desc" style="padding-left:0">勾选参与「混合」元数据搜索的源；「未接入」的源为占位，暂不可用。</div></div>
            <div id="setSrcList"></div>
            <div class="form-row">
              <label class="label" for="setShionlibKey">Shionlib API Key</label>
              <div class="field"><input id="setShionlibKey" type="password" autocomplete="off" placeholder="未配置">
                <span class="desc">Shionlib 开放接口需要 API Key；仅用于其来源增强。</span></div>
            </div>
            <div class="form-row">
              <label class="label" for="setKungalConcurrent">Kungal 并发</label>
              <div class="field"><select id="setKungalConcurrent">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
              </select><span class="desc">Kungal 锚点搜索并发数；受接口限速影响</span></div>
            </div>
          </div>
          <div class="group">
            <div class="g-title">封面下载</div>
            <div class="form-row">
              <label class="label" for="setCoverTimeout">下载超时</label>
              <div class="field"><select id="setCoverTimeout">
                <option value="30">30 秒</option>
                <option value="60">60 秒</option>
                <option value="90" selected>90 秒</option>
                <option value="120">120 秒</option>
                <option value="300">300 秒</option>
              </select><span class="desc">VNDB 封面较慢，可调大</span></div>
            </div>
            <div class="form-row">
              <label class="label" for="setCoverConcurrent">最大并发</label>
              <div class="field"><select id="setCoverConcurrent">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
              </select><span class="desc">并发数改动重启后生效</span></div>
            </div>
          </div>
        </div>
        <div class="page" id="set-about" style="display:none">
          <div class="about">
            <div class="a-logo">☺</div>
            <div class="a-name">KazariPlay</div>
            <div class="a-ver">版本 {{APP_VERSION}} · {{PRODUCT_LINE}}</div>
            <div class="a-update"><button type="button" class="pill-btn" id="btnCheckUpdate">检查更新</button><span class="a-update-status" id="updateStatus"></span></div>
            <div class="a-meta">视觉小说本地库启动器<br><span id="setCfgPath"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="reset" id="setReset">恢复默认</button>
      <button class="pill-btn" id="setCancel">关闭</button>
      <button class="pill-btn primary" id="setSave">保存</button>
    </div>
  </div>
</div>
